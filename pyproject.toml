[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "first-reply"
version = "0.1.0"
description = "Service-desk triage with local LLMs: ticket routing, hybrid-search RAG with cited replies, human approval"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohiith Gettala Balachandar" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "scikit-learn>=1.5",
  "typer>=0.12",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[project.scripts]
first-reply = "first_reply.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/first_reply"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "RET", "C4"]
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"src/first_reply/cli.py" = ["PLR0917"]  # Typer maps parameters to CLI flags

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src/first_reply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "data: needs the prepared datasets (skipped when missing)",
  "llm: needs a running model server (skipped when missing)",
]
