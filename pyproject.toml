[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "first-reply"
version = "0.1.0"
description = "Service-desk triage with local LLMs: ticket routing, hybrid-search RAG with cited replies, human approval"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohiith Gettala Balachandar" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "httpx>=0.27",
  "pydantic>=2.7",
  "qdrant-client>=1.12",
  "scikit-learn>=1.5",
  "typer>=0.12",
]

[project.optional-dependencies]
# torch comes from the CPU wheel index: pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = ["sentence-transformers>=3", "transformers>=4.45"]
gateway = ["litellm[proxy]>=1.75"]
service = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[project.scripts]
first-reply = "first_reply.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/first_reply"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "RET", "C4"]
ignore = ["PLR0913", "PLR2004", "PLC0415", "SIM905"]  # SIM905: word lists read better as strings

[tool.ruff.lint.per-file-ignores]
"src/first_reply/cli.py" = ["PLR0917"]  # Typer maps parameters to CLI flags
"src/first_reply/service/review.py" = ["E501"]  # one HTML/JS page in a string

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src/first_reply"]

# torch/transformers are optional: typed when installed, Any when not (as in the lint CI job).
[[tool.mypy.overrides]]
module = "first_reply.routing.finetune"
disallow_subclassing_any = false
disallow_untyped_calls = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "data: needs the prepared datasets (skipped when missing)",
  "llm: needs a running model server (skipped when missing)",
]
