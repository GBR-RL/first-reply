# The full stack: mail server, n8n workflow, triage service, LLM server behind the gateway,
# vector store, spend database and trace viewer. Prepare ./data first (see README):
#   first-reply data && first-reply kb-chunks   (+ the embedding cache in data/cache)
# and put a GGUF model at ./models/model.gguf.

services:
  greenmail:
    image: greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=support:support@first-reply.test,customer:customer@example.com
    ports: ["3025:3025", "3143:3143", "8080:8080"]

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["6333:6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 30

  llama:
    build:
      context: .
      dockerfile: docker/llama.Dockerfile
    command: >-
      -m /models/model.gguf --jinja -c 8192 -np 1 --host 0.0.0.0 --port 8081
    volumes: ["./models:/models:ro"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/health"]
      interval: 5s
      retries: 120

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "litellm"]
      interval: 5s
      retries: 30

  gateway:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/config/litellm.yaml", "--port", "4000"]
    environment:
      QWEN_URL: http://llama:8081/v1
      GRANITE_URL: http://llama:8081/v1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-compose}
      DATABASE_URL: postgresql://litellm:litellm@postgres:5432/litellm
      STORE_MODEL_IN_DB: "False"
    volumes: ["./gateway/litellm.yaml:/config/litellm.yaml:ro"]
    ports: ["4000:4000"]
    depends_on:
      llama: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 5s
      retries: 60

  phoenix:
    image: arizephoenix/phoenix:version-20.19.0
    ports: ["6006:6006"]

  service:
    build: .
    environment:
      QDRANT_URL: http://qdrant:6333
      FIRST_REPLY_LLM_URL: http://gateway:4000/v1
      FIRST_REPLY_LLM_KEY: ${SERVICE_KEY:-sk-compose}
      FIRST_REPLY_DB: /app/data/cases.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - ./data:/app/data
      - ./docs/results:/app/docs/results:ro
      - hf:/models/hf
    ports: ["8000:8000"]
    depends_on:
      qdrant: {condition: service_healthy}
      gateway: {condition: service_healthy}

  n8n:
    image: n8nio/n8n:2.42.5
    entrypoint: ["/bin/sh", "/workflows/start.sh"]
    environment:
      N8N_ENCRYPTION_KEY: compose-demo-key
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://n8n:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      MAIL_HOST: greenmail
      SERVICE_URL: http://service:8000
    volumes: ["./workflows:/workflows:ro"]
    ports: ["5678:5678"]
    depends_on:
      service: {condition: service_healthy}
      greenmail: {condition: service_started}

volumes:
  hf:
