name: Stack

# Builds and starts the whole Docker Compose stack (GreenMail, n8n, service, llama.cpp,
# LiteLLM + Postgres, Qdrant, Phoenix) and runs the end-to-end smoke test: a customer email
# goes in over IMAP, a reviewer approves, the reply comes out over SMTP.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["compose.yaml", "Dockerfile", "docker/**", "workflows/**", "gateway/**",
            "src/first_reply/service/**", ".github/workflows/stack.yml"]
  pull_request:
    paths: ["compose.yaml", "Dockerfile", "docker/**", "workflows/**", "gateway/**",
            "src/first_reply/service/**", ".github/workflows/stack.yml"]

permissions:
  contents: read
  actions: read

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-v1-${{ hashFiles('src/first_reply/data/download.py') }}
      - name: Prepare data
        run: |
          first-reply data
          first-reply kb-chunks
      - name: Embedding cache (bge-m3 tickets and knowledge-base chunks)
        run: |
          gh run download 37732694295 -n embeddings-bge-m3-tickets -D data/cache/embeddings/bge-m3
          gh run download 37739053460 -n embeddings-bge-m3-kb-chunks-sections -D data/cache/embeddings/bge-m3
          ls -la data/cache/embeddings/bge-m3
      - name: Model
        id: model
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-qwen3.5-4b-v1
      - if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSfL --retry 3 -o models/model.gguf "$(first-reply model-url qwen3.5-4b)"
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 1500
      - name: Smoke test
        run: python -m first_reply.service.smoke
      - if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 400 n8n service
          docker compose logs --tail 80 greenmail gateway llama
      - if: always()
        run: docker compose down --volumes
