name: Embeddings

# Encodes a corpus in parallel shards on CPU runners and publishes the merged vectors as an
# artifact. bge-m3 manages ~3 texts/s on a laptop CPU, so the heavy corpora are encoded here.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Embedding model key (e5-small, bge-m3)
        required: true
        default: bge-m3
      corpus:
        description: Corpus to encode (tickets, kb-questions, kb-chunks-<chunker>)
        required: true
        default: tickets
      shards:
        description: Number of parallel shards (max 16)
        required: true
        default: "16"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 -c "import json;print('matrix='+json.dumps(list(range(int('${{ inputs.shards }}')))))" >> "$GITHUB_OUTPUT"

  encode:
    needs: plan
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[ml]"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-v1-${{ hashFiles('src/first_reply/data/download.py') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ inputs.model }}-v1
      - name: Prepare data
        run: first-reply data
      - name: Encode shard
        run: >
          first-reply embed --model ${{ inputs.model }} --corpus ${{ inputs.corpus }}
          --shard ${{ matrix.shard }} --shards ${{ inputs.shards }}
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: data/cache/embeddings/${{ inputs.model }}/*.npz
          retention-days: 3

  merge:
    needs: encode
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: data/cache/embeddings/${{ inputs.model }}
          merge-multiple: true
      - name: Merge shards
        run: first-reply embed-merge --model ${{ inputs.model }} --corpus ${{ inputs.corpus }}
      - uses: actions/upload-artifact@v4
        with:
          name: embeddings-${{ inputs.model }}-${{ inputs.corpus }}
          path: data/cache/embeddings/${{ inputs.model }}/${{ inputs.corpus }}.npz
          retention-days: 30
